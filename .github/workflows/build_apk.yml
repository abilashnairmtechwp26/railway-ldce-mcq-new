name: Build Railway LDCE APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android project scaffolding
        run: |
          flutter create --platforms=android --project-name railway_ldce_mcq --org com.railway.ldce /tmp/flutter_build
          cp pubspec.yaml /tmp/flutter_build/pubspec.yaml
          cp -r lib/* /tmp/flutter_build/lib/

      - name: Ensure Internet permission & App Name
        run: |
          MANIFEST="/tmp/flutter_build/android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MANIFEST"
          fi
          sed -i 's|android:label="[^"]*"|android:label="Railway LDCE MCQ"|' "$MANIFEST"

      - name: Fetch dependencies and build Release APK
        working-directory: /tmp/flutter_build
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: railway-ldce-mcq-apk
          path: /tmp/flutter_build/build/app/outputs/flutter-apk/app-release.apk
